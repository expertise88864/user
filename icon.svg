<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f0fbfa"/><stop offset="1" stop-color="#cdebe7"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#14b8a6"/><stop offset="0.55" stop-color="#0e7c86"/><stop offset="1" stop-color="#0c5159"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g fill="none" stroke="url(#teal)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
