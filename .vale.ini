# Vale prose linter config — DermNotes
# Round 3-L from OPEN_SOURCE_INTEGRATIONS.md.
#
# Lints article HTML for:
#   • Terminology consistency (drug-name forms, disease synonyms)
#   • YMYL banned phrases (no "100% 治癒" / "保證根治")
#   • Patient-unfriendly sentence length on -myths articles
#
# Phase-in: start as warnings (level = suggestion), promote to error
# as we clean fallout. Skip resident/clinical articles (intentionally
# technical) from sentence-length rules.

StylesPath = styles

# Skip release notes / changelogs / generated files
SkippedScopes = code, comment, math

# Treat HTML as the source format (Vale auto-detects markdown/HTML).
[*.html]
BasedOnStyles = DermNotes

# Don't lint script + style blocks
TokenIgnores = (?s)<script.*?<\/script>, (?s)<style.*?<\/style>, (?s)<svg.*?<\/svg>

# Skip JSON-LD attribute payloads (data-zh / data-en duplicate content)
BlockIgnores = (?ms)data-(zh|en|cat|tag(-en)?|emoji)="[^"]*"

[blog/*-clinical.html]
# Clinical-depth articles are allowed longer sentences (resident-level)
DermNotes.LongSentence = NO

[blog/dupilumab-long-term-maintenance.html]
DermNotes.LongSentence = NO

[blog/psoriasis-biologic-monitoring.html]
DermNotes.LongSentence = NO

[blog/ai-dermatology-roles.html]
DermNotes.LongSentence = NO
