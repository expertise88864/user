name: Accessibility (pa11y-ci + axe-core)

# Round 2-G from OPEN_SOURCE_INTEGRATIONS.md
# pa11y-ci runs axe-core (100+ WCAG 2.1 AA rules) + HTMLCS dual coverage
# against representative URLs from the sitemap. Complements our
# Python `_check_static_a11y.py` (~10 hand-rolled rules) with the
# de-facto industry-standard accessibility engine.
#
# Required on the exact candidate SHA and again after promotion.

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly sweep to catch a11y regressions from new content
    - cron: '0 8 * * 1'  # Monday 08:00 UTC

permissions:
  contents: read
  pull-requests: write

jobs:
  pa11y:
    name: pa11y-ci (axe + HTMLCS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # pin v4 (was @v4)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pin v4 (was @v4)
        with: { node-version: '20' }

      - name: Install pa11y-ci
        run: npm install -g pa11y-ci@4

      - name: Install Python (for site server)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pin v5 (was @v5)
        with: { python-version: '3.12' }

      - name: Serve site
        run: node _serve.mjs --host 127.0.0.1 --port 8080 &

      - name: Wait for server
        run: |
          for i in $(seq 1 20); do
            if curl -sSf http://127.0.0.1:8080/ -o /dev/null; then exit 0; fi
            sleep 0.5
          done
          echo "Server failed to start"; exit 1

      - name: Run pa11y-ci
        run: |
          pa11y-ci --config .pa11yci.json

      - name: Upload pa11y report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pin v4 (was @v4)
        with:
          name: pa11y-report
          path: pa11y-report.json
          if-no-files-found: ignore
          retention-days: 14
