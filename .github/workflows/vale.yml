name: Prose lint (Vale)

# Round 3-L from OPEN_SOURCE_INTEGRATIONS.md
# Vale lints article HTML against the DermNotes style package:
#   • BannedYMYL.yml      — error on 保證根治 / 100% 治癒 / 推薦使用 etc.
#   • Terminology.yml     — warn on 黃褐斑 (use 肝斑), pasi (use PASI), etc.
#   • LongSentence.yml    — suggest splitting >50-char CJK sentences
#                            (disabled per-article for clinical-depth pages)
#   • Disclaimer.yml      — flag YMYL keywords missing disclaimer block
#
# Errors block publication; existing terminology warnings remain warnings.

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
    paths:
      - 'blog/**.html'
      - 'en/blog/**.html'
      - '.vale.ini'
      - 'styles/**'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  vale:
    name: Vale prose lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # pin v4 (was @v4)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - name: Run Vale
        uses: errata-ai/vale-action@d89dee975228ae261d22c15adcd03578634d429c # pin v2 (was @v2)
        with:
          version: 3.7.1
          # Restrict to article files (not navigation pages with structural markup)
          files: 'blog en/blog'
          fail_on_error: true
          filter_mode: nofilter
          # Surface findings as GitHub checks, including push-triggered runs.
          reporter: github-check
