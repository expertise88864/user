name: Prose lint (Vale)

# Round 3-L from OPEN_SOURCE_INTEGRATIONS.md
# Vale lints article HTML against the DermNotes style package:
#   • BannedYMYL.yml      — error on 保證根治 / 100% 治癒 / 推薦使用 etc.
#   • Terminology.yml     — warn on 黃褐斑 (use 肝斑), pasi (use PASI), etc.
#   • LongSentence.yml    — suggest splitting >50-char CJK sentences
#                            (disabled per-article for clinical-depth pages)
#   • Disclaimer.yml      — flag YMYL keywords missing disclaimer block
#
# Errors block publication; existing terminology warnings remain warnings.

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
    paths:
      - 'blog/**.html'
      - 'en/blog/**.html'
      - '.vale.ini'
      - 'styles/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vale:
    name: Vale prose lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # pin v4 (was @v4)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - name: Install pinned Vale
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/vale.tar.gz" \
            https://github.com/vale-cli/vale/releases/download/v3.7.1/vale_3.7.1_Linux_64-bit.tar.gz
          echo "ba4924bf2c5884499f09b02a6eb3318b29df40a3e81701c0804b9b1aefcd9483  $RUNNER_TEMP/vale.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/vale-bin"
          tar -xzf "$RUNNER_TEMP/vale.tar.gz" -C "$RUNNER_TEMP/vale-bin" vale
          echo "$RUNNER_TEMP/vale-bin" >> "$GITHUB_PATH"
      - name: Run Vale
        # Use Vale's real exit code. The reviewdog reporter creates unrelated
        # neutral check-runs in other workflows sharing this SHA.
        run: vale --minAlertLevel=error blog en/blog
