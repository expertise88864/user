name: Link & anchor check (hyperlink)

# Tier 1B from OPEN_SOURCE_INTEGRATIONS.md — Rust CLI link checker.
# Complements the Python `_check_internal_links.py` audit by adding
# anchor-ID validation (`--check-anchors`): catches TOC links like
# `href="#some-id"` that point to nonexistent H2 ids on the same page.
#
# Speed: 700 HTML pages in ~220 ms (default) / ~850 ms with --check-anchors.
#
# Runs in parallel with the main Quality gate.

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hyperlink:
    name: Link and anchor validation (Vercel routes + hyperlink diagnostics)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # pin v4 (was @v4)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Cache hyperlink binary
        id: hyperlink-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # pin v4 (was @v4)
        with:
          path: ~/.local/bin/hyperlink
          # Pin a known stable version. Bump deliberately. Verified
          # 2026-05-20 against latest release.
          key: hyperlink-bin-0.2.0-${{ runner.os }}

      - name: Install hyperlink (Rust CLI)
        if: steps.hyperlink-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p "$HOME/.local/bin"
          # Release 0.2.0 ships as .tar.xz (xz compression, not gzip).
          # Note `tar -xJf` for xz vs `tar -xzf` for gzip.
          curl -sSL -o /tmp/hyperlink.tar.xz \
            "https://github.com/untitaker/hyperlink/releases/download/0.2.0/hyperlink-x86_64-unknown-linux-gnu.tar.xz"
          # Verify the download is actually an xz archive before extract
          # (curl 4xx pages return HTML, not xz — fail fast if so).
          if ! file /tmp/hyperlink.tar.xz | grep -qi "XZ compressed"; then
            echo "Downloaded file is not an XZ archive — install URL stale."
            file /tmp/hyperlink.tar.xz
            head -c 200 /tmp/hyperlink.tar.xz
            exit 1
          fi
          tar -xJf /tmp/hyperlink.tar.xz -C "$HOME/.local/bin" --strip-components=0
          # Some release tarballs nest the binary in a subdirectory; flatten.
          if [ ! -f "$HOME/.local/bin/hyperlink" ]; then
            binary=$(find "$HOME/.local/bin" -name hyperlink -type f -print -quit)
            test -n "$binary"
            mv "$binary" "$HOME/.local/bin/hyperlink"
          fi
          chmod +x "$HOME/.local/bin/hyperlink"

      - name: Add hyperlink to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: '3.12' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '20' }
      - name: Validate production routes and fragments (blocking)
        # Independent Python check for clean URLs and runtime calculator targets.
        run: python _check_internal_links.py

      - name: Verify hyperlink installed
        run: hyperlink --version

      - name: Check links + anchor IDs across all HTML
        # Hyperlink requires a filesystem routing mirror for Vercel clean URLs.
        # Every bad file or fragment remains a nonzero, blocking failure.
        run: python _check_hyperlink.py
