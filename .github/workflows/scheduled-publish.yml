name: Scheduled publication preparation

# Trusted main discovers version-bound author requests. This stage creates
# source-only review artifacts; it does not run/claim release CI or publish.
# Every resulting candidate still requires the unchanged full delivery gates.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: scheduled-publish-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          # Read-only authentication stays in this trusted checkout. Disposable
          # clones share objects only, not the GitHub credential configuration.
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: '3.12' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '20' }
      - name: Discover author-approved source requests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python _process_article_requests.py --output "$RUNNER_TEMP/cms-source-artifacts"
      - name: Preserve source bundles for independent review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cms-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cms-source-artifacts/
          if-no-files-found: error
          retention-days: 14
