name: Scheduled publish

# Runs every 15 minutes. Reads .github/scheduled-publish/queue.json,
# merges any drafts/<slug> branches whose scheduled time has passed
# into main, then removes processed entries from the queue.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    concurrency:
      group: scheduled-publish-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # pin v4 (was @v4)
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "Scheduled Publish Bot"
          git config user.email "bot@chendermatologist.com"

      - name: Process scheduled queue
        run: |
          python3 <<'PY'
          import json, subprocess, os, re, sys
          from datetime import datetime, timezone

          QUEUE_PATH = '.github/scheduled-publish/queue.json'
          SLUG_RE = re.compile(r'^[a-z0-9]+(?:-[a-z0-9]+)*$')
          if not os.path.exists(QUEUE_PATH):
              print('No queue file at', QUEUE_PATH, '— nothing to do.')
              sys.exit(0)

          with open(QUEUE_PATH, encoding='utf-8') as f:
              queue = json.load(f)

          if not isinstance(queue, list):
              raise ValueError('Scheduled publish queue must be a JSON array')

          if not queue:
              print('Queue is empty.')
              sys.exit(0)

          now = datetime.now(timezone.utc)
          due, remaining = [], []
          for item in queue:
              try:
                  if not isinstance(item, dict):
                      raise ValueError('entry must be an object')
                  slug = item.get('slug')
                  branch = item.get('branch')
                  file_path = item.get('file')
                  if not isinstance(slug, str) or not SLUG_RE.fullmatch(slug):
                      raise ValueError('invalid slug')
                  if branch != f'drafts/{slug}':
                      raise ValueError('branch must exactly match drafts/<slug>')
                  if file_path != f'blog/{slug}.html':
                      raise ValueError('file must exactly match blog/<slug>.html')
                  at_str = item['at'].replace('Z', '+00:00')
                  at = datetime.fromisoformat(at_str)
                  if at.tzinfo is None:
                      raise ValueError('scheduled time must include a timezone')
                  at = at.astimezone(timezone.utc)
              except Exception as e:
                  print(f'  skip malformed entry: {item} ({e})')
                  remaining.append(item)
                  continue
              if at <= now:
                  due.append(item)
              else:
                  remaining.append(item)

          print(f'Queue: {len(due)} due, {len(remaining)} pending')

          if not due:
              sys.exit(0)

          subprocess.check_call(['git', 'fetch', 'origin'])
          subprocess.check_call(['git', 'pull', '--ff-only', 'origin', 'main'])

          merged_any = False
          merged_branches = []
          for item in due:
              slug = item['slug']
              branch = item['branch']
              print(f'\n>>> Processing {slug} from {branch}')
              # Check that branch exists on origin
              r = subprocess.run(['git', 'ls-remote', '--heads', 'origin', branch],
                                 capture_output=True, text=True)
              if r.returncode != 0:
                  print(f'  Failed to query origin for {branch}: {r.stderr.strip()}')
                  raise subprocess.CalledProcessError(
                      r.returncode, r.args, output=r.stdout, stderr=r.stderr
                  )
              if not r.stdout.strip():
                  print(f'  Branch {branch} not found on origin — keeping queue entry for manual recovery')
                  remaining.append(item)
                  continue
              try:
                  subprocess.check_call(['git', 'merge', '--no-ff', f'origin/{branch}',
                                         '-m', f'scheduled publish: {slug} (queued {item.get("added_at","?")})'])
                  print(f'  ✓ Merged {branch} into main')
                  merged_any = True
                  merged_branches.append(branch)
              except subprocess.CalledProcessError as e:
                  print(f'  ✗ Merge conflict for {branch}: {e}')
                  # Re-queue for manual handling
                  remaining.append(item)
                  subprocess.run(['git', 'merge', '--abort'], check=False)

          # Write updated queue
          with open(QUEUE_PATH, 'w', encoding='utf-8') as f:
              json.dump(remaining, f, indent=2, ensure_ascii=False)
              f.write('\n')
          subprocess.check_call(['git', 'add', QUEUE_PATH])

          # Commit queue update (only if there's something to commit)
          r = subprocess.run(['git', 'diff', '--cached', '--quiet'])
          if r.returncode != 0:
              subprocess.check_call(['git', 'commit', '-m', f'scheduled-publish: processed {len(due)} due item(s)'])

          if merged_any or r.returncode != 0:
              subprocess.check_call(['git', 'push', 'origin', 'main'])
              print('\n✓ Pushed to main')
              # Delete source branches only after the main push is durable.
              # A failed push leaves both queue state and drafts recoverable.
              for branch in merged_branches:
                  try:
                      subprocess.check_call(['git', 'push', 'origin', '--delete', branch])
                      print(f'  ✓ Deleted draft branch {branch}')
                  except subprocess.CalledProcessError:
                      print(f'  ⚠ Could not delete {branch}, ignoring')
          PY
