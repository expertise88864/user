name: Delivery verification
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  contract:
    name: Delivery contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Delivery Python regression tests
        run: python -m unittest _test_delivery
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Production deployment gate regression tests
        run: node --test _test_vercel_gate.cjs
  preview:
    name: Preview browser
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/heads/codex/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Resolve exact-SHA preview (never production)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python _delivery.py preview "$GITHUB_SHA" --wait 600 > "$RUNNER_TEMP/delivery-preview-url"
          echo "PW_BASE_URL=$(cat "$RUNNER_TEMP/delivery-preview-url")" >> "$GITHUB_ENV"
      - name: Install browser
        run: |
          npm install --global playwright@1.60.0
          echo "NODE_PATH=$(npm root --global)" >> "$GITHUB_ENV"
          playwright install --with-deps chromium
      - name: Verify preview pages in desktop and mobile browsers
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node _delivery_preview.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: delivery-preview-${{ github.sha }}
          path: delivery-preview/
          if-no-files-found: error
