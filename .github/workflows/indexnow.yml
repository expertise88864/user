name: IndexNow submit

# Push updated URLs to Bing / Yandex / Seznam / Naver after every
# main-branch deploy so they re-crawl within hours instead of the
# usual days-to-weeks polling cycle. Google ignores IndexNow but the
# Bing / Yandex slice still moves the needle for low-traffic sites.
#
# Runs after the Quality gate workflow finishes successfully — that's
# the same trigger order Vercel uses, so we know the site is fresh.

on:
  workflow_run:
    workflows: ["Quality gate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "submission scope"
        required: true
        default: "since-1"
        type: choice
        options:
          - since-1
          - since-7
          - full-sitemap

permissions:
  contents: read

jobs:
  submit:
    name: Submit URLs to IndexNow
    runs-on: ubuntu-latest
    # Only run if the Quality gate run actually succeeded (don't notify
    # search engines about a broken deploy).
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        # workflow_run 觸發時 GITHUB_TOKEN 的 default checkout 偶爾會
        # 試圖以 HTTPS 認證、終端機 prompt 被禁用 → "could not read
        # Username for 'https://github.com'" + exit 128。我們只需要讀
        # 取 sitemap.xml、不需要 push、所以關掉 persist-credentials +
        # 顯式帶 GITHUB_TOKEN + 跳過 submodule init。
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
          submodules: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Determine scope
        id: scope
        run: |
          mode="${{ github.event.inputs.mode }}"
          if [ -z "$mode" ]; then
            mode="since-1"  # default for workflow_run trigger
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Submit to IndexNow
        run: |
          case "${{ steps.scope.outputs.mode }}" in
            since-1)        python _submit_indexnow.py --since 1 ;;
            since-7)        python _submit_indexnow.py --since 7 ;;
            full-sitemap)   python _submit_indexnow.py ;;
            *)              python _submit_indexnow.py --since 1 ;;
          esac
