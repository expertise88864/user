name: IndexNow submit

# Notify participating search engines only for verified current production.
# Receipt does not guarantee crawling, indexing deadlines or traffic.

on:
  workflow_run:
    workflows: ["Delivery verification"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "submission scope"
        required: true
        default: "since-1"
        type: choice
        options:
          - since-1
          - since-7
          - full-sitemap

permissions:
  contents: read
  actions: read
  deployments: read

jobs:
  submit:
    name: Submit URLs to IndexNow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Reject stale/foreign origins before an old checkout can run an ungated submitter.
    if: >
      github.repository == 'expertise88864/user' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_sha == github.sha &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    env:
      INDEXNOW_TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      INDEXNOW_SCOPE: ${{ inputs.mode || 'since-1' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # pin v4 (was @v4)
        with:
          ref: ${{ env.INDEXNOW_TARGET_SHA }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
          submodules: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pin v5 (was @v5)
        with: { python-version: '3.12' }
      - name: Verify current production and notify IndexNow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$INDEXNOW_SCOPE" in
            since-1)       python _submit_indexnow.py --sha "$INDEXNOW_TARGET_SHA" --wait 600 --since 1 ;;
            since-7)       python _submit_indexnow.py --sha "$INDEXNOW_TARGET_SHA" --wait 600 --since 7 ;;
            full-sitemap)  python _submit_indexnow.py --sha "$INDEXNOW_TARGET_SHA" --wait 600 ;;
            *)             echo "Invalid IndexNow scope" >&2; exit 2 ;;
          esac
