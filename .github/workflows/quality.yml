name: Quality gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Serialize canonical regeneration runs so two pushes do not race each
# other to write generated files back to main.
concurrency:
  group: feeds-regen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  feeds-regen:
    name: Auto-regen canonical generated files
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # pin v4 (was @v4)
        with: { token: '${{ secrets.GITHUB_TOKEN }}', fetch-depth: 0 }
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pin v5 (was @v5)
        with: { python-version: '3.12' }
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pin v4 (was @v4)
        with: { node-version: '20' }
      - name: Regenerate canonical site files
        run: |
          python _run_quality.py regen
          python _gen_search_index.py
          python _minify.py
          python _gen_csp_hashes.py
          python _run_quality.py check
      - name: Commit + push with retry on race
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "generated files already up-to-date"
            exit 0
          fi
          # Commit-message tokens:
          # - `[skip actions]` skips GH Actions only (prevents regen loop).
          # - `[skip actions]` is NOT recognized by Vercel, so Vercel WILL
          #   deploy this commit — exactly what we want, since this commit
          #   reflects the canonical state (admin edit + auto-regen).
          # - Previously used `[skip ci]` which Vercel ALSO honors, causing
          #   admin saves to silently not deploy. Switched 2026-05-14.
          git commit -m "auto-regen canonical generated files [skip actions]"
          # Regenerate after every rebase so generated files describe the
          # newest source tree, not the commit that originally triggered us.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt rejected — pulling + rebasing"
            git pull --rebase origin main
            python _run_quality.py regen
            python _gen_search_index.py
            python _minify.py
            python _gen_csp_hashes.py
            python _run_quality.py check
            git add -A
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
          done
          echo "::error::Failed to push after 5 attempts"
          exit 1

  html-validate:
    name: HTML structural validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # pin v4 (was @v4)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pin v5 (was @v5)
        with: { python-version: '3.12' }
      - name: Setup Java for html5validator
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # pin v4 (was @v4)
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pin v4 (was @v4)
        with: { node-version: '20' }
      - name: Install validators
        run: |
          pip install html5validator lxml
      - name: Run html5validator (whitelist common Tailwind/SVG/modern-CSS noise)
        # NOTE: html5validator uses argparse nargs='+' for --ignore-re with action='store',
        # so repeating the flag OVERWRITES (only the last wins). All patterns must be
        # passed as multiple values to a SINGLE --ignore-re flag.
        run: |
          html5validator --root . --match "*.html" --log INFO \
            --ignore-re \
              "Attribute .* is not allowed on element" \
              'Attribute "[^"]+" not allowed on element' \
              "Element .* not allowed as child of" \
              'CSS: "inset"' \
              'CSS: "text-underline-offset"' \
              'CSS: "text-wrap"' \
              'CSS: "background-clip"' \
              'CSS: "backdrop-filter"' \
              'CSS: "content-visibility"' \
              'CSS: "contain-intrinsic-size"' \
              'CSS: "aspect-ratio"' \
              'CSS: "padding-(top|bottom|left|right)".*env\(' \
              'CSS: "padding": "env\(' \
              'CSS: "min-height": Unknown dimension' \
              'CSS: "max-height": Unknown dimension' \
              'CSS: "height": Unknown dimension' \
              'CSS: "[a-z-]+": Parse Error' \
              'CSS: Unrecognized at-rule "@view-transition"' \
              "CSS: Parse Error" \
              'Bad value "speculationrules" for attribute "type" on element "script"'
      - name: Quick lint — JSON-LD blocks parse cleanly
        run: |
          python <<'PY'
          import json, re, glob, sys
          err = 0
          for p in glob.glob('**/*.html', recursive=True):
              if any(x in p for x in ['.git','node_modules']): continue
              with open(p, encoding='utf-8') as f: s = f.read()
              for i, m in enumerate(re.finditer(r'<script type="application/ld\+json">([\s\S]*?)</script>', s)):
                  try: json.loads(m.group(1))
                  except Exception as e:
                      print(f'JSON-LD ERR  {p} block {i}: {e}'); err += 1
          sys.exit(1 if err else 0)
          PY

  link-check:
    name: Internal link check (broken anchors / bad hrefs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # pin v4 (was @v4)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pin v5 (was @v5)
        with: { python-version: '3.12' }
      - name: Run link audit
        run: |
          python <<'PY'
          import os, re, glob, sys
          # Collect all internal page paths
          pages = set()
          for p in glob.glob('**/*.html', recursive=True):
              if any(x in p for x in ['.git','node_modules']): continue
              # Normalize: blog/index.html → /blog/, X.html → /X
              path = p.replace('\\', '/')
              if path.endswith('/index.html'): pages.add('/' + path[:-10].rstrip('/') + '/')
              elif path == 'index.html': pages.add('/')
              else: pages.add('/' + path[:-5])  # /blog/acne-myths
          # Scan all hrefs
          err = 0
          for p in glob.glob('**/*.html', recursive=True):
              if any(x in p for x in ['.git','node_modules']): continue
              with open(p, encoding='utf-8') as f: s = f.read()
              for m in re.finditer(r'href="(/[^"#?]*)"', s):
                  href = m.group(1)
                  if href.startswith('//') or href.startswith('http'): continue
                  if href.startswith('/blog/feed') or href.startswith('/blog/atom') or href.startswith('/sitemap') or href.startswith('/robots'): continue
                  # Skip JS template literals (contain quote/concat chars from inline scripts)
                  if any(c in href for c in ["'", "+", "${", "`"]): continue
                  # Resolve to canonical form
                  candidates = [
                      href, href + '/', href + '.html',
                      href[1:] if href.startswith('/') else href,
                      href[1:] + '.html' if href.startswith('/') else href + '.html',
                      (href[1:] + '/index.html') if href.startswith('/') else (href + '/index.html')
                  ]
                  if any(os.path.exists(c) for c in candidates): continue
                  if href in pages: continue
                  if any(href.startswith(prefix) for prefix in ['/icon','/favicon','/apple-touch','/logo-','/blog/SUNN','/manifest','/assets','/ads']):
                      continue
                  print(f'BROKEN  {p}  → {href}'); err += 1
          sys.exit(1 if err else 0)
          PY

  meta-check:
    name: SEO/meta sanity (title / description / canonical / OG)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # pin v4 (was @v4)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pin v5 (was @v5)
        with: { python-version: '3.12' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pin v4 (was @v4)
        with: { node-version: '20' }
      - name: Pre-audit regen (mirror feeds-regen so audit doesn't race against it)
        # feeds-regen runs in parallel and commits [skip actions]; meta-check picks
        # up the pre-regen state and would fail on @id mismatches in /en/ mirrors OR
        # on a stale sitemap.xml that includes pages just flipped to noindex.
        # Re-run the FULL regen subset that affects audited surfaces:
        #   - EN gen rewrites en/ mirrors (canonical, hreflang)
        #   - schema normalize fixes JSON-LD @ids
        #   - feeds regen rebuilds sitemap.xml with current noindex state
        #
        # Without _gen_feeds.py here, a commit that flips a page noindex but
        # forgets to re-stage sitemap.xml will cause _check_sitemap.py to red-line
        # this job until the parallel feeds-regen workflow commits a fresh sitemap.
        run: |
          python _gen_en_pages.py
          python _normalize_schema.py --include-en
          python _gen_feeds.py
      - name: Quick required-tag audit
        run: |
          python <<'PY'
          import re, glob, sys
          err = 0
          REQ = [
              ('<title>', 'missing <title>'),
              ('name="description"', 'missing meta description'),
              ('rel="canonical"', 'missing canonical'),
              ('property="og:url"', 'missing OG URL'),
              ('property="og:title"', 'missing OG title'),
              ('property="og:image"', 'missing OG image'),
          ]
          for p in glob.glob('**/*.html', recursive=True):
              if any(x in p for x in ['.git','node_modules','offline','admin','404','reset-sw']): continue
              with open(p, encoding='utf-8') as f: s = f.read()
              for needle, msg in REQ:
                  if needle not in s:
                      print(f'META  {p}: {msg}'); err += 1
          sys.exit(1 if err else 0)
          PY
      - name: Deep meta + sitemap consistency audit (_check_meta.py)
        run: python _check_meta.py
      - name: Metadata uniqueness audit
        run: python _check_metadata_uniqueness.py
      - name: Robots/sitemap consistency audit
        run: python _check_robots.py
      - name: Sitemap URL/canonical audit
        run: python _check_sitemap.py
      - name: Internal link and anchor audit
        run: python _check_internal_links.py
      - name: Public/private index boundary audit
        run: python _check_index_boundaries.py
      - name: Static accessibility audit
        run: python _check_static_a11y.py
      - name: Inline event audit
        run: python _check_inline_events.py
      - name: Structured data audit
        run: python _audit_jsonld.py
      - name: PWA manifest/offline/SW audit
        run: python _check_pwa.py
      - name: Performance budget audit
        run: python _check_performance_budget.py
      - name: Text integrity audit
        run: python _check_text_integrity.py
      - name: English internal-link audit
        run: python _check_en_internal_links.py
      - name: Third-party loading audit
        run: python _check_third_party.py
      - name: External link rel audit
        run: python _check_external_links.py
      - name: Button type audit
        run: python _check_button_types.py
      - name: Deployment config audit
        run: python _check_deployment.py
      - name: API security audit
        run: python _check_api_security.py
      - name: Secret leak audit
        run: python _check_secrets.py
      - name: Supply-chain audit
        run: python _check_supply_chain.py
      - name: JavaScript syntax audit
        run: npm run check-js
      - name: Runtime smoke audit
        run: npm run check-smoke

  lighthouse:
    name: Lighthouse CI (perf + a11y + SEO + best practices)
    runs-on: ubuntu-latest
    needs: html-validate
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # pin v4 (was @v4)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pin v4 (was @v4)
        with: { node-version: '20' }
      - name: Install LHCI
        run: npm install -g @lhci/cli@0.13.x
      - name: Serve site
        run: node _serve.mjs --host 127.0.0.1 --port 8080 &
      - name: Wait for server
        run: sleep 3
      - name: Run Lighthouse CI
        run: |
          lhci autorun \
            --collect.url=http://localhost:8080/ \
            --collect.url=http://localhost:8080/blog/ \
            --collect.url=http://localhost:8080/blog/acne-myths.html \
            --collect.url=http://localhost:8080/about.html \
            --collect.url=http://localhost:8080/tools.html \
            --collect.numberOfRuns=1 \
            --upload.target=temporary-public-storage \
            --assert.assertions.categories:performance=0.7 \
            --assert.assertions.categories:accessibility=0.85 \
            --assert.assertions.categories:best-practices=0.85 \
            --assert.assertions.categories:seo=0.95
      - name: Render Lighthouse summary to job step
        if: always()
        run: |
          python <<'PY'
          import json, glob, os
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if not summary_path: exit(0)
          out_lines = ['# Lighthouse Scores', '', '| URL | Perf | A11y | Best | SEO |', '|---|---:|---:|---:|---:|']
          # LHCI writes JSON results into .lighthouseci/
          for fp in sorted(glob.glob('.lighthouseci/lhr-*.json')):
              try:
                  with open(fp) as f: data = json.load(f)
                  url = data.get('finalUrl', '?').replace('http://localhost:8080', '')
                  cats = data.get('categories', {})
                  def s(k):
                      v = cats.get(k, {}).get('score')
                      return f'{int(v*100)}' if v is not None else 'n/a'
                  out_lines.append(f'| `{url}` | {s("performance")} | {s("accessibility")} | {s("best-practices")} | {s("seo")} |')
              except Exception as e:
                  print(f'parse fail {fp}: {e}')
          if len(out_lines) > 4:
              with open(summary_path, 'a') as f:
                  f.write('\n'.join(out_lines) + '\n\n')
              print('summary written')
          PY
