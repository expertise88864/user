# Decap CMS configuration — git-based content management.
# Live at /admin/  — edits commit directly to the GitHub repo and Vercel auto-deploys.
#
# AUTH: choose ONE backend before going live:
#   1) github     — direct GitHub OAuth (needs OAuth app + proxy server). Simplest if self-hosted on Vercel.
#   2) git-gateway — uses Netlify Identity for auth (recommended; free quota covers solo author).
#                    Need to host the site on Netlify OR run netlify-identity-widget separately.
#
# For Vercel + GitHub OAuth, use a small proxy like https://github.com/vencax/netlify-cms-github-oauth-provider
# deployed as a Vercel serverless function.

backend:
  name: github                        # change to git-gateway if using Netlify Identity
  repo: expertise88864/user           # actual owner/repo
  branch: main
  base_url: https://chendermatologist.com
  auth_endpoint: api/auth             # see /api/auth.js (placeholder)
  open_authoring: false               # solo author — no PR fork flow

# Drafts go to a separate folder so they don't ship until published
publish_mode: editorial_workflow

# Show "View Draft" button so author can preview unpublished posts
show_preview_links: true

# Media uploads (article images, etc.)
media_folder: assets/uploads
public_folder: /assets/uploads

# Editor accent — match site palette
locale: zh_Hant
display_url: https://chendermatologist.com

collections:
  # ───────────────────── Blog articles ─────────────────────
  - name: articles
    label: 衛教文章 (Articles)
    label_singular: 文章
    folder: blog
    create: true
    extension: html
    format: frontmatter
    slug: '{{slug}}'
    preview_path: blog/{{slug}}
    fields:
      - { name: title, label: 文章標題, widget: string }
      - { name: tag,   label: 分類標籤, widget: select, options: ['痘痘','防曬','異膚','兒童異膚','肝斑','美白','酒糟肌','玫瑰斑','落髮','圓禿','足癬','病毒疣','皮蛇','蕁麻疹','結節性癢疹','乾癬','化膿性汗腺炎','猴痘','酸類','口服 A 酸','外用類固醇','生物製劑','白斑','標靶藥物','常見問題','粉瘤','健保規範','雷射 / 光電','皮膚淋巴瘤','痘疤'] }
      - { name: tag_en, label: English tag, widget: string }
      - { name: cat,   label: 類別, widget: select, options: ['myth','rx','product'], default: 'myth' }
      - { name: date,  label: 發布日期, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }
      - { name: description, label: SEO 描述 (≤ 160 字元), widget: text, pattern: ['.{0,180}', '請保持在 180 字元內'] }
      - { name: body,  label: 內文 (Markdown / HTML), widget: markdown }

  # ───────────────────── Glossary entries ─────────────────────
  - name: glossary
    label: 醫學詞彙 (Glossary)
    files:
      - file: data/glossary.json
        label: 醫學詞彙條目
        name: glossary
        format: json
        fields:
          - name: terms
            label: 詞彙條目
            widget: list
            fields:
              - { name: zh, label: 中文, widget: string }
              - { name: en, label: 英文, widget: string }
              - { name: def, label: 白話定義, widget: text }
              - { name: cat, label: 分類, widget: string, required: false }

  # ───────────────────── Site config ─────────────────────
  - name: config
    label: 站台設定
    files:
      - file: data/site-config.json
        label: 全站設定
        name: site
        format: json
        fields:
          - { name: title, label: 站名, widget: string }
          - { name: tagline, label: 標語, widget: string }
          - { name: author_name, label: 作者姓名, widget: string }
          - { name: contact_email, label: 聯絡 Email, widget: string }
          - { name: popular_picks, label: 首頁熱門推薦 (slug 列表), widget: list, field: { name: slug, label: Slug, widget: string } }
